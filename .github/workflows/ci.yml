name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migrate:
    name: Migrate production database
    # Only after everything passes on main. Skipped until the secret is set.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Check for database secret
        id: secret
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::notice::DATABASE_URL_UNPOOLED is not set; skipping migrations."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secret.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.secret.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.secret.outputs.present == 'true'
        run: npm ci
      - if: steps.secret.outputs.present == 'true'
        run: npm run db:status || true
      - if: steps.secret.outputs.present == 'true'
        run: npm run db:migrate
